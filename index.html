<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<title>Pierce Music Room Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#f8f6f5; --surface:#ffffff; --surface-2:#f2efed; --surface-3:#e9e5e2;
  --ink:#171a1d; --ink-2:#4a4f55; --ink-3:#7b8189; --line:#e2ddd9; --line-2:#cfc8c3;
  --accent:#7a2937; --accent-ink:#ffffff; --accent-soft:#f3e4e6; --accent-line:#d9b6bc;
  --k-class:#b8862b; --k-class-bg:#fbf1dc; --k-amp:#3f7396; --k-amp-bg:#e4eef5;
  --k-accomp:#5f8a5c; --k-accomp-bg:#e6f0e5; --k-office:#bd6a3e; --k-office-bg:#fbeae0;
  --k-encore:#7f639c; --k-encore-bg:#efe9f5; --k-checkout:#7a2937; --k-checkout-bg:#f7e7e9;
  --k-event:#2d8a8a; --k-event-bg:#dff0ef; --k-tutoring:#a34a78; --k-tutoring-bg:#f8e6ef;
  --k-blocked:#6b7076; --k-blocked-bg:#eceaea;
  --warn:#9a6407; --warn-bg:#fdf0d8; --ok:#3f6b45;
  --shadow:0 1px 2px rgba(23,26,29,.06),0 8px 24px -12px rgba(23,26,29,.18);
  --shadow-lg:0 2px 8px rgba(23,26,29,.08),0 24px 60px -20px rgba(23,26,29,.32);
  --r:7px; --gut:60px; --colw:172px; --ppm:1.0;
  --font-d:"Bricolage Grotesque","Helvetica Neue",sans-serif;
  --font-b:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161a; --surface:#1b1e23; --surface-2:#22262c; --surface-3:#2b3037;
  --ink:#eceaea; --ink-2:#b3b8bf; --ink-3:#848b94; --line:#2e333a; --line-2:#3d434c;
  --accent:#e08a99; --accent-ink:#20131a; --accent-soft:#3a222a; --accent-line:#5c3540;
  --k-class:#e0b464; --k-class-bg:#3a3021; --k-amp:#8ab6d6; --k-amp-bg:#1f2c37;
  --k-accomp:#96c091; --k-accomp-bg:#212e21; --k-office:#e39a6f; --k-office-bg:#382519;
  --k-encore:#b79ed4; --k-encore-bg:#2c2436; --k-checkout:#e08a99; --k-checkout-bg:#37212a;
  --k-event:#76c6c2; --k-event-bg:#1c3230; --k-tutoring:#dd93b8; --k-tutoring-bg:#37222d;
  --k-blocked:#9aa1a9; --k-blocked-bg:#262a2f;
  --warn:#e0b464; --warn-bg:#3a3021; --ok:#8fc196;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 24px 60px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#14161a; --surface:#1b1e23; --surface-2:#22262c; --surface-3:#2b3037;
  --ink:#eceaea; --ink-2:#b3b8bf; --ink-3:#848b94; --line:#2e333a; --line-2:#3d434c;
  --accent:#e08a99; --accent-ink:#20131a; --accent-soft:#3a222a; --accent-line:#5c3540;
  --k-class:#e0b464; --k-class-bg:#3a3021; --k-amp:#8ab6d6; --k-amp-bg:#1f2c37;
  --k-accomp:#96c091; --k-accomp-bg:#212e21; --k-office:#e39a6f; --k-office-bg:#382519;
  --k-encore:#b79ed4; --k-encore-bg:#2c2436; --k-checkout:#e08a99; --k-checkout-bg:#37212a;
  --k-event:#76c6c2; --k-event-bg:#1c3230; --k-tutoring:#dd93b8; --k-tutoring-bg:#37222d;
  --k-blocked:#9aa1a9; --k-blocked-bg:#262a2f;
  --warn:#e0b464; --warn-bg:#3a3021; --ok:#8fc196;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 24px 60px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.mast,.bar,.legend{flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mast h1{font-family:var(--font-d);font-size:19px;font-weight:800;margin:0;letter-spacing:-.015em}
.mast .dept{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mast .spacer{flex:1}
.badge{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  padding:4px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge.edit{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--ok);margin-right:6px;vertical-align:1px}

/* ---------- control bar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);z-index:60}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:var(--r);padding:6px 11px;cursor:pointer;
  font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.date-nav{display:flex;align-items:center;gap:4px}
.datestamp{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:-.01em;
  min-width:190px;text-align:center}
.datestamp small{display:block;font-family:var(--font-b);font-weight:600;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
input[type=date],input[type=time],input[type=text],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 9px}
input[type=text]::placeholder{color:var(--ink-3)}
.search{min-width:170px}
.bar .spacer{flex:1}

/* ---------- grid ---------- */
.stage{overflow:auto;background:var(--paper);position:relative;flex:1;min-height:0}
.grid{display:grid;min-width:max-content;position:relative}
.hd{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line-2);
  padding:8px 9px;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.hd .rn{font-family:var(--font-m);font-weight:600;font-size:13px;letter-spacing:-.02em}
.hd .rd{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hd.corner{position:sticky;left:0;top:0;z-index:40;border-right:1px solid var(--line-2)}
.hd+.hd{border-left:1px solid var(--line)}
.hd.today{box-shadow:inset 0 -3px 0 var(--accent)}
.gut{position:sticky;left:0;z-index:20;background:var(--paper);border-right:1px solid var(--line-2);
  }
.col{position:relative;border-left:1px solid var(--line);background:var(--surface)}
.col.free{cursor:copy}
.col:nth-child(2n){background:var(--surface-2)}
.tick{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.tick.half{border-top-style:dotted;opacity:.65}
.tlab{position:absolute;right:10px;transform:translateY(-50%);display:flex;align-items:baseline;
  gap:2px;font-family:var(--font-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.tlab b{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.tlab i{font-size:9.5px;font-style:normal;font-weight:600;color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:14;pointer-events:none}
.nowline{opacity:.75}
.col:first-of-type .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--accent)}

/* ---------- events ---------- */
.ev{position:absolute;left:3px;right:3px;border-radius:5px;padding:4px 6px 3px;overflow:hidden;
  cursor:pointer;border:1px solid;border-left-width:3px;z-index:10;
  transition:box-shadow .12s,transform .12s;text-align:left;font:inherit;display:block;width:calc(100% - 6px)}
.ev:hover{box-shadow:var(--shadow);z-index:15}
.ev .t{font-family:var(--font-m);font-size:10px;font-weight:500;opacity:.8;letter-spacing:-.02em}
.ev .n{font-weight:700;font-size:11.5px;line-height:1.22;margin-top:1px;
  overflow-wrap:break-word;hyphens:none}
.ev .s{font-size:10.5px;line-height:1.25;opacity:.85;margin-top:1px;overflow-wrap:break-word}
.ev.narrow .t{font-size:9px}
.ev.narrow .n{font-size:10.5px;line-height:1.18}
.ev.narrow .s{font-size:9.5px}
.ev.short{padding:2px 6px}
.ev.short .t{font-size:9px;line-height:1.1}
.ev.short .n{font-size:10px;line-height:1.14}
.ev.short .s{font-size:9px;line-height:1.14}
.ev.short .flag{display:none}
.ev.tiny{padding:1px 6px;display:flex;align-items:center;gap:5px}
.ev.tiny .t{font-size:9px;flex:none}
.ev.tiny .n{font-size:9.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tiny .s,.ev.tiny .flag{display:none}
.ev[data-k=class]{background:var(--k-class-bg);border-color:var(--k-class);color:var(--ink)}
.ev[data-k=amp]{background:var(--k-amp-bg);border-color:var(--k-amp)}
.ev[data-k=accomp]{background:var(--k-accomp-bg);border-color:var(--k-accomp)}
.ev[data-k=office]{background:var(--k-office-bg);border-color:var(--k-office)}
.ev[data-k=encore]{background:var(--k-encore-bg);border-color:var(--k-encore)}
.ev[data-k=event]{background:var(--k-event-bg);border-color:var(--k-event)}
.ev[data-k=tutoring]{background:var(--k-tutoring-bg);border-color:var(--k-tutoring)}
.ev[data-k=checkout]{background:var(--k-checkout-bg);border-color:var(--k-checkout)}
.ev[data-k=blocked]{background:var(--k-blocked-bg);border-color:var(--k-blocked);
  background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(107,112,118,.16) 6px 12px)}
.ev.cancelled{opacity:.5;background-image:none;background:var(--surface-3);
  border-color:var(--line-2);border-left-style:dashed}
.ev.cancelled .n,.ev.cancelled .s{text-decoration:line-through}
.ev.moved{box-shadow:inset 0 0 0 1px var(--warn)}
.ev.dim{opacity:.28}
.flag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:1px 4px;border-radius:3px;margin-top:2px;background:var(--warn-bg);color:var(--warn)}
.flag.cx{background:var(--surface-3);color:var(--ink-2)}

/* ---------- legend ---------- */
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px 20px;
  border-top:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px;
  background:transparent;border:1px solid transparent;border-radius:20px;padding:3px 9px;
  cursor:pointer;color:var(--ink-2);font-family:inherit;transition:background .12s,border-color .12s}
.lg:hover{background:var(--surface-2);border-color:var(--line)}
.lg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.lg.clear{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.legend .meta{margin-left:auto;color:var(--ink-3);font-weight:500;padding-left:10px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid;border-left-width:3px;flex:none}
.termnote{padding:8px 20px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:500}
.findnote{padding:8px 20px;background:var(--accent-soft);color:var(--ink);
  border-bottom:1px solid var(--accent-line);font-size:12.5px;line-height:1.5;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.findnote>strong{color:var(--accent);font-family:var(--font-m);flex:none}
.findnote .hits{display:flex;flex-wrap:wrap;gap:3px 16px}
.findnote .hit{font-size:12px;color:var(--ink-2)}
.findnote .hit b{font-weight:700;color:var(--ink)}
.blank{padding:40px 20px;color:var(--ink-3);font-size:13px;line-height:1.6}
.blank strong{color:var(--ink-2);font-family:var(--font-m)}
.rmtag{display:inline-block;font-family:var(--font-m);font-size:9px;font-weight:600;
  background:var(--ink);color:var(--paper);border-radius:3px;padding:0 3px;margin-right:4px;
  vertical-align:1px;letter-spacing:0}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,26,29,.42);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);
  border-left:1px solid var(--line-2);box-shadow:var(--shadow-lg);z-index:210;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dhead h2{font-family:var(--font-d);font-size:17px;font-weight:800;margin:0;letter-spacing:-.015em;flex:1}
.dhead .sub{font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:500}
.dbody{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
/* the drawer body is a flex column, so its children would otherwise shrink
   below their content and clip - lists of rooms or changes lose their last row */
.dbody>*{flex:none}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;
  background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 10px;
  cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font-m);letter-spacing:-.02em}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.wd{font-family:var(--font-b);letter-spacing:.03em}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.note strong{color:inherit}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;align-items:baseline}
.kv dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);
  padding-top:2px}
.kv dd{margin:0}
.sec-t{font-family:var(--font-d);font-size:13px;font-weight:700;letter-spacing:.02em;
  padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.item{background:var(--surface);padding:9px 11px;display:flex;gap:10px;align-items:flex-start;
  cursor:pointer;text-align:left;border:0;width:100%;font:inherit}
.item:hover{background:var(--surface-2)}
.item .bar-c{width:3px;align-self:stretch;border-radius:2px;flex:none}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:12.5px;font-weight:700}
.item .m span{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--font-m)}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:12.5px;
  border:1px dashed var(--line-2);border-radius:var(--r)}
.hidden{display:none !important}
.signin{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);z-index:210;
  width:min(370px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:22px;opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s}
.signin.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.signin h2{font-family:var(--font-d);font-size:18px;font-weight:800;margin:0;letter-spacing:-.015em}
.si-sub{font-size:12.5px;color:var(--ink-3);margin:6px 0 16px;line-height:1.5}
.signin form{display:flex;flex-direction:column;gap:12px}
.si-err{margin:0;font-size:12.5px;color:var(--accent);font-weight:600;line-height:1.5}
.pwwrap{position:relative;display:flex}
.pwwrap input{flex:1;padding-right:58px}
.pwtoggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;cursor:pointer;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-radius:5px}
.pwtoggle:hover{background:var(--surface-2);color:var(--ink-2)}
.si-actions{display:flex;gap:8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* ---------- phones ---------- */
@media (max-width:760px){
  :root{--colw:150px;--gut:50px}

  .mast{padding:10px 14px 8px;gap:8px}
  .mast h1{font-size:16px}
  .mast .dept{font-size:9.5px;letter-spacing:.1em}
  .badge{font-size:9.5px;padding:3px 7px}

  /* one scrolling row of controls instead of three stacked ones */
  .bar{padding:8px 14px;gap:6px;flex-wrap:nowrap;overflow-x:auto;
       scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:none}
  .bar .spacer{display:none}
  .btn{padding:8px 11px}                       /* taller tap targets */
  .seg button{padding:8px 12px}
  .datestamp{min-width:0;font-size:13.5px;white-space:nowrap}
  .datestamp small{font-size:9px}
  .search{min-width:150px;padding:8px 10px}
  input[type=date]{padding:7px 8px}

  /* the legend scrolls sideways rather than eating four rows of height */
  .legend{padding:7px 14px;gap:4px;flex-wrap:nowrap;overflow-x:auto;
          scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .legend>*{flex:none}
  .legend .meta{display:none}

  .termnote,.findnote{padding:7px 14px;font-size:12px}
  .findnote{flex-direction:column;gap:4px}
  .findnote .hits{flex-direction:column;gap:2px}

  /* the drawer reads better as a bottom sheet on a phone */
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;height:88vh;height:88dvh;
          border-left:0;border-top:1px solid var(--line-2);
          border-radius:16px 16px 0 0;transform:translateY(100%)}
  .drawer.on{transform:none}
  .dhead{padding:14px 16px 10px}

const BASE = DATA.baseline;
const MASTER_ROOMS = DATA.rooms.slice();
let ROOMS = MASTER_ROOMS.slice();
// "3414-M" must sort before "3416-B", so pad digit runs before comparing.
const natKey = x => String(x).replace(/(\d+)/g, m => m.padStart(6, "0"));
const byRoom = (a, b) => natKey(a).localeCompare(natKey(b));
const roomSlug = n => String(n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const TERM = (window.ROOM_CHECKOUT_CONFIG && window.ROOM_CHECKOUT_CONFIG.term)
  || {name:"Fall 2026", start:"2026-08-31", end:"2026-12-20"};
const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const KINDLABEL = {class:"Class",amp:"AMP lesson",accomp:"Accompanist",tutoring:"Tutoring",
  office:"Office hours",encore:"Encore",event:"Event",checkout:"Checkout",blocked:"Blocked"};
const KINDVAR = {class:"--k-class",amp:"--k-amp",accomp:"--k-accomp",tutoring:"--k-tutoring",
  office:"--k-office",encore:"--k-encore",event:"--k-event",checkout:"--k-checkout",

const BOOKABLE = ["checkout","event","tutoring","amp","accomp","office","encore","blocked"];

/* ---------- time + date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const toMin = hm => { const [h,m] = hm.split(":").map(Number); return h*60+m; };
const toHM  = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmt12 = m => { const h=Math.floor(m/60), mm=m%60, ap=h>=12?"pm":"am";
  const h12 = h%12===0?12:h%12; return h12+(mm?":"+pad(mm):"")+" "+ap; };
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const longDate = s => parseISO(s).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
const shortDate = s => parseISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const dow = s => parseISO(s).getDay();
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const PRACTICE = MASTER_ROOMS.filter(r => /^3414-[A-I]\b/.test(r));
const isPractice = r => PRACTICE.includes(r);
const roomTag = r => (r.match(/^3414-([A-I])\b/)||[,""])[1];

const state = {
  date: iso(new Date()), view:"day", weekRoom: ROOMS[0], q:"",
  collapsePractice: true, kinds: new Set(), rooms: new Map(), hidden: new Set(),
  canEdit:false, db:null, downloads:null,
  exceptions:new Map(), reservations:new Map(), sel:null
};
const exKey = (baseId,date) => baseId.replace(/[^A-Za-z0-9_.~:@+-]/g,"_")+"__"+date;

const HIDE_KEY = "roomCheckout.hiddenRooms";
function loadHidden(){

const isHidden = r => state.hidden.has(r);

function rebuildRooms(){
  const extra = [...state.rooms.values()].map(r => r.name).filter(Boolean);

/* ---------- occurrence model ----------
   A day's picture = weekly baseline from the master schedule
   - per-date exceptions (cancel / move / note)
   + reservations (checkouts and block-outs) that cover the date.        */
function inTerm(date){ return date >= TERM.start && date <= TERM.end; }
function occurrencesOn(date){
  const wd = dow(date), out = [];
  if (inTerm(date)) for (const b of BASE){
    if (b.dow !== wd) continue;
    const ex = state.exceptions.get(exKey(b.id,date));
    const o = { srcId:b.id, src:"base", date, kind:b.kind, room:b.room,
      start:toMin(b.start), end:toMin(b.end), code:b.code, title:b.title,
      person:b.instructor, cancelled:false, moved:false, note:"", dateNote:"", ex:ex||null,
      origRoom:b.room, origStart:toMin(b.start), origEnd:toMin(b.end) };
    if (ex){
      o.note = ex.note||""; o.dateNote = ex.note||"";
      if (ex.status === "cancelled") o.cancelled = true;
      else if (ex.status === "moved"){
        o.moved = true;
        if (ex.room) o.room = ex.room;
        if (ex.start) o.start = toMin(ex.start);
        if (ex.end)   o.end   = toMin(ex.end);
      } else if (ex.status === "noted") o.moved = false;
    }
    out.push(o);
  }
  for (const [id,r] of state.reservations){
    if (r.cancelled) continue;
    if (date < r.dateStart || date > r.dateEnd) continue;
    if (Array.isArray(r.days) && r.days.length && !r.days.includes(wd)) continue;
    const ex = state.exceptions.get(exKey("res:"+id,date));
    for (const room of (r.rooms||[])){
      const o = { srcId:"res:"+id, resId:id, src:"res", date, kind:r.kind||"checkout", room,
        start:toMin(r.timeStart), end:toMin(r.timeEnd), code:"", title:r.title||"Checkout",
        person:r.person||"", cancelled:false, moved:false, note:r.note||"", dateNote:"", ex:ex||null,
        origRoom:room, origStart:toMin(r.timeStart), origEnd:toMin(r.timeEnd), res:r };
      if (ex){
        if (ex.note){ o.note = ex.note; o.dateNote = ex.note; }
        if (ex.status === "cancelled") o.cancelled = true;
        else if (ex.status === "moved"){
          o.moved = true;
          if (ex.room) o.room = ex.room;
          if (ex.start) o.start = toMin(ex.start);
          if (ex.end)   o.end   = toMin(ex.end);
        }
      }
      out.push(o);
    }
  }
  return out.sort((a,b)=>a.start-b.start||a.end-b.end);
}
const searchable = o => [o.room,o.title,o.code,o.person,KINDLABEL[o.kind]]
  .map(v=>String(v||"").toLowerCase()).join(" ~ ");
const matchQ = o => !state.q || searchable(o).includes(state.q.toLowerCase());

/* Where a search term sits in the weekly schedule, so "216-3" answers which
   room, which days and what time without paging through the week. */
function weeklyMatches(q){
  const needle = q.toLowerCase();
  const hits = BASE.filter(b => [b.room,b.title,b.code,b.instructor]
    .map(v=>String(v||"").toLowerCase()).join(" ~ ").includes(needle));
  const groups = new Map();
  for (const b of hits){
    const key = [b.code,b.title,b.instructor,b.room,b.start,b.end].join("|");
    if (!groups.has(key)) groups.set(key, Object.assign({}, b, {days:[]}));
    groups.get(key).days.push(b.dow);
  }
  return [...groups.values()].sort((a,b)=>a.days[0]-b.days[0] || a.start.localeCompare(b.start));
}
const matchKind = o => { const sel = state.kinds; if (!sel.size) return true;
  return sel.has(o.kind) || (sel.has("__cancelled") && o.cancelled); };
const overlaps = (a,b) => a.start < b.end && b.start < a.end;

/* ---------- grid rendering ---------- */
function gridBounds(all){
  let lo = 8*60, hi = 22*60;
  for (const o of all){ if(o.start<lo) lo=Math.floor(o.start/60)*60; if(o.end>hi) hi=Math.ceil(o.end/60)*60; }
  return [lo,hi];
}
function render(){
  const grid = document.getElementById("grid");
  const isWeek = state.view === "week";
  const days = isWeek ? Array.from({length:7},(_,i)=>addDays(weekStart(state.date),i)) : [state.date];
  let cols;
  if (isWeek){
    cols = days.map(d=>({key:d, label:DAYNAMES[dow(d)].slice(0,3), sub:shortDate(d),
      date:d, rooms:[state.weekRoom]}));
  } else {
    cols = [];
    let folded = false;
    const shownPractice = PRACTICE.filter(r => !isHidden(r));
    for (const r of ROOMS){
      if (isHidden(r)) continue;
      if (state.collapsePractice && isPractice(r)){
        if (folded) continue;
        folded = true;
        cols.push({key:"__practice", label:"3414-A – I", sub:"Practice \u00d7"+shownPractice.length,
          date:state.date, rooms:shownPractice, group:true});
        continue;
      }
      cols.push({key:r, label:r.split(" ")[0], sub:(r.match(/\((.+)\)/)||[,""])[1],
        date:state.date, rooms:[r]});
    }
    if (!cols.length) cols = [{key:"__none", label:"", sub:"", date:state.date, rooms:[]}];
  }

  const byCol = new Map();
  let all = [];
  const searching = !!state.q;
  for (const c of cols){
    let occ = occurrencesOn(c.date)
      .filter(o => c.rooms.includes(o.room))
      .filter(matchKind);
    if (searching) occ = occ.filter(matchQ);
    byCol.set(c.key, occ); all = all.concat(occ);
  }
  if (searching && !isWeek) cols = cols.filter(c => byCol.get(c.key).length);
  const [lo,hi] = gridBounds(all);
  const ppm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ppm"))||1;
  const PAD = 12;                       // breathing room above the first hour
  const H = (hi-lo)*ppm + PAD*2;
  const y = min => PAD + (min-lo)*ppm;  // minutes-past-midnight -> pixels

  grid.style.gridTemplateColumns = `var(--gut) repeat(${cols.length}, minmax(var(--colw), 1fr))`;
  const todayISO = iso(new Date());
  let html = `<div class="hd corner"><div class="rd">Time</div></div>`;
  for (const c of cols){
    const isToday = c.date === todayISO && isWeek;
    html += `<div class="hd${isToday?" today":""}"><div class="rn">${esc(c.label)}</div>`+
            (c.sub?`<div class="rd">${esc(c.sub)}</div>`:``)+`</div>`;
  }
  // time gutter
  html += `<div class="gut" style="height:${H}px">`;
  for (let m = lo; m <= hi; m += 60){
    const h = Math.floor(m/60), h12 = h%12===0 ? 12 : h%12;
    html += `<div class="tlab" style="top:${y(m)}px">` +
            `<b>${h12}</b><i>${h>=12?"pm":"am"}</i></div>`;
  }
  html += `</div>`;
  // columns
  for (const c of cols){
    const occ = byCol.get(c.key);
    html += `<div class="col${(state.canEdit && !c.group)?" free":""}" data-col="${esc(c.key)}" data-room="${esc(c.rooms[0])}" data-date="${c.date}" style="height:${H}px">`;
    for (let m = lo; m <= hi; m += 30)
      html += `<div class="tick${m%60===0?"":" half"}" style="top:${y(m)}px"></div>`;
    if (c.date === todayISO){
      const now = new Date(), nm = now.getHours()*60+now.getMinutes();
      if (nm>=lo && nm<=hi) html += `<div class="nowline" style="top:${y(nm)}px"></div>`;
    }
    // lay out overlaps side by side
    const lanes = assignLanes(occ);
    occ.forEach((o,i)=>{
      const L = lanes[i], top=y(o.start), h=Math.max(15,(o.end-o.start)*ppm-2);
      const w = 100/L.of, left = L.idx*w;
      const cls = ["ev"]; if(o.cancelled)cls.push("cancelled"); if(o.moved)cls.push("moved");
      if(h<26)cls.push("tiny"); else if(h<40)cls.push("short");
      if(L.of>1)cls.push("narrow");
      const sub = [o.code,o.person].filter(Boolean).join(" &middot; ");
      const tag = c.group ? `<span class="rmtag">${esc(roomTag(o.room))}</span>` : "";
      html += `<button class="${cls.join(" ")}" data-k="${o.kind}" data-i="${i}" data-col="${esc(c.key)}"
        style="top:${top}px;height:${h}px;left:calc(${left}% + 3px);width:calc(${w}% - 6px)"
        title="${esc(o.title)} ${fmt12(o.start)}-${fmt12(o.end)}">
        <div class="t">${fmt12(o.start)} &ndash; ${fmt12(o.end)}</div>
        <div class="n">${tag}${esc(o.title)}</div>
        ${sub?`<div class="s">${sub}</div>`:``}
        ${o.cancelled?`<span class="flag cx">Cancelled</span>`:o.moved?`<span class="flag">Changed</span>`:
          o.dateNote?`<span class="flag">Note</span>`:``}
      </button>`;
    });
    html += `</div>`;
  }
  grid.innerHTML = html;
  paintSearchNote();
  const blank = !isWeek && (!visibleRooms().length || (searching && !cols.length));
  if (blank){
    grid.innerHTML = `<div class="blank">${
      !visibleRooms().length
        ? `Every room is hidden. Open <strong>Rooms</strong> and choose Show all to bring them back.`
        : `Nothing on this day matches <strong>${esc(state.q)}</strong>. Try another day, or clear the filter.`
    }</div>`;
    grid.style.gridTemplateColumns = "1fr";
    paintStamp(); paintChangeCount();
    document.getElementById("termnote").classList.add("hidden");
    return;
  }
  const anyInTerm = days.some(inTerm);
  const tn = document.getElementById("termnote");
  tn.classList.toggle("hidden", anyInTerm);
  if (!anyInTerm) tn.innerHTML = `Outside the <strong>${esc(TERM.name)}</strong> term
    (${esc(shortDate(TERM.start))} &ndash; ${esc(longDate(TERM.end))}). No classes are scheduled here.
    Rooms can still be checked out.`;
  grid.querySelectorAll(".ev").forEach(el=>{
    el.addEventListener("click", ()=> openOccurrence(byCol.get(el.dataset.col)[+el.dataset.i]));
  });
  if (state.canEdit) grid.querySelectorAll(".col").forEach(el=>{
    el.addEventListener("click", e=>{
      if (e.target.closest(".ev")) return;
      const yPx = e.clientY - el.getBoundingClientRect().top;
      const m = Math.max(lo, Math.min(hi-30, Math.round((lo + (yPx-PAD)/ppm)/15)*15));
      openNew({room:el.dataset.room, date:el.dataset.date, start:toHM(m), end:toHM(Math.min(hi,m+60))});
    });
  });
  paintStamp(); paintChangeCount();
}
function paintSearchNote(){
  const el = document.getElementById("findnote");
  if (!state.q){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  const hits = weeklyMatches(state.q);
  if (!hits.length){
    el.innerHTML = `<strong>${esc(state.q)}</strong> &mdash; no class matches.
      Any checkouts or events matching it still show below.`;
    return;
  }
  el.innerHTML = `<strong>${esc(state.q)}</strong><span class="hits">${hits.map(h=>`<span class="hit">
      <b>${esc([h.code,h.title].filter(Boolean).join(" \u2013 "))}</b>
      ${esc(h.days.map(d=>DAYNAMES[d].slice(0,3)).join(" & "))}
      ${fmt12(toMin(h.start))}&ndash;${fmt12(toMin(h.end))}
      &middot; ${esc(h.room.split(" ")[0])}${h.instructor?" &middot; "+esc(h.instructor):""}</span>`).join("")}</span>`;
}

function assignLanes(occ){
  const ends=[], out=[];
  const groups=[]; let cur=[];
  occ.forEach(o=>{
    if (cur.length && !cur.some(x=>overlaps(x.o,o))) { groups.push(cur); cur=[]; }
    cur.push({o});
  });
  if (cur.length) groups.push(cur);
  for (const g of groups){
    const lanes=[];
    for (const item of g){
      let idx = lanes.findIndex(end => end <= item.o.start);
      if (idx === -1){ idx = lanes.length; lanes.push(0); }
      lanes[idx] = item.o.end; item.idx = idx;
    }
    for (const item of g) out[occ.indexOf(item.o)] = {idx:item.idx, of:lanes.length};
  }
  return out;
}
function weekStart(d){ return addDays(d, -dow(d)); }

function findConflicts(r){
  const out=[]; let d=r.dateStart, guard=0;
  while (d <= r.dateEnd && guard++ < 400){
    if (!r.days.length || r.days.includes(dow(d))){
      for (const o of occurrencesOn(d)){
        if (o.cancelled || !r.rooms.includes(o.room)) continue;
        if (o.start < toMin(r.timeEnd) && toMin(r.timeStart) < o.end)
          out.push({date:d, room:o.room, title:o.title, start:o.start, end:o.end});
      }
    }
    d = addDays(d,1);
  }
  return out;
}
/* ---------- availability search ----------
   Walks every date matching the chosen weekdays inside the range and asks,
   per room, whether anything already overlaps the requested window. */
function findFree(q){
  const dates = [];
  let d = q.from, guard = 0;
  while (d <= q.to && guard++ < 400){
    if (!q.days.length || q.days.includes(dow(d))) dates.push(d);
    d = addDays(d, 1);
  }
  const s = toMin(q.start), e = toMin(q.end);
  const rows = ROOMS.map(room => ({room, freeOn:[], busyOn:[], clashes:new Map()}));
  const byRoom = new Map(rows.map(r => [r.room, r]));
  for (const date of dates){
    const hits = new Map();
    for (const o of occurrencesOn(date)){
      if (o.cancelled) continue;
      if (o.start < e && s < o.end){
        if (!hits.has(o.room)) hits.set(o.room, []);
        hits.get(o.room).push(o);
      }
    }
    for (const r of rows){
      const h = hits.get(r.room);
      if (!h) { r.freeOn.push(date); continue; }
      r.busyOn.push(date);
      for (const o of h){
        const label = o.title + (o.person ? " \u00b7 " + o.person : "");
        r.clashes.set(label, (r.clashes.get(label)||0) + 1);
      }
    }
  }
  rows.sort((a,b) => b.freeOn.length - a.freeOn.length || byRoom2(a.room, b.room));
  return {dates, rows};
}
const byRoom2 = (a,b) => byRoom(a,b);

    const never  = rows.filter(r => !r.freeOn.length);

  }
  run();
}

function roomUsage(name){

        <span class="m"><b>${esc(r.name)}</b>
        <span>${used ? used+" checkout"+(used>1?"s":"") : "No checkouts"}</span></span>
        <button class="btn ghost" data-del="${esc(id)}" style="font-size:12px;padding:3px 8px;color:var(--accent)">Remove</button>
      </div>`;}).join("")}</div>`
      : `<div class="empty">No rooms added yet. The ${MASTER_ROOMS.length} rooms below come from the master schedule.</div>`}
    ${state.canEdit ? `<div class="sec-t">From the master schedule</div>
    <div class="note">${MASTER_ROOMS.map(r=>esc(r.split(" ")[0])).join(" &middot; ")}
      <div style="margin-top:6px">These come from the Class Schedule spreadsheet and change when a
      new term is imported, so they can't be removed here.</div></div>` : ``}`;
  openDrawer("Rooms", nHidden ? `${ROOMS.length - nHidden} of ${ROOMS.length} shown` : `${ROOMS.length} rooms`,
    body, `${state.canEdit ? `<button class="btn primary" id="rAdd">Add room</button>` : ``}<button class="btn ghost" id="rClose">Done</button>`);

  const applyVis = () => { saveHidden(); paintRoomsBtn(); render(); };
  drawer.querySelectorAll("[data-vis]").forEach(b => b.onclick = ()=>{
    const r = b.dataset.vis, on = b.getAttribute("aria-pressed") === "true";
    on ? state.hidden.add(r) : state.hidden.delete(r);
    b.setAttribute("aria-pressed", String(!on));
    applyVis(); openRooms();
  });
  document.getElementById("vAll").onclick  = ()=>{ state.hidden.clear(); applyVis(); openRooms(); };
  document.getElementById("vNone").onclick = ()=>{ ROOMS.forEach(r=>state.hidden.add(r)); applyVis(); openRooms(); };

  const $ = id => document.getElementById(id);
  $("rClose").onclick = closeDrawer;
  if (!state.canEdit) return;
  const err = m => { const e = $("rErr"); e.textContent = m; e.hidden = false; };
  $("rAdd").onclick = async ()=>{
    const num = $("rNum").value.trim(), label = $("rLabel").value.trim();
    if (!num) return err("Enter a room number.");
    const name = label ? `${num} (${label})` : num;
    if (ROOMS.includes(name)) return err("That room is already in the grid.");
    if (ROOMS.some(r => r.split(" ")[0] === num))
      return err(`Room ${num} is already in the grid under a different label.`);
    const id = roomSlug(name);
    if (!id) return err("That room number has no letters or digits in it.");
    try { await state.db.doc("rooms/"+id).set({name, number:num, label, at:Date.now()}); }
    catch(e){ return err("Could not save. If you were signed in, your session may have expired."); }
    openRooms();
  };
  $("rNum").onkeydown = e => { if (e.key === "Enter") $("rAdd").click(); };
  $("rLabel").onkeydown = e => { if (e.key === "Enter") $("rAdd").click(); };
  drawer.querySelectorAll("[data-del]").forEach(b => b.onclick = async ()=>{
    const id = b.dataset.del, r = state.rooms.get(id);
    const used = r ? roomUsage(r.name) : 0;
    if (used && !confirm(`${r.name} has ${used} checkout${used>1?"s":""}. Removing the room leaves them in place but they will stop showing in the grid. Remove it?`)) return;
    try { await state.db.doc("rooms/"+id).delete(); } catch(e){ return err("Could not remove that room."); }
    openRooms();
  });
}

function openChanges(){
  const rows = [];
  for (const [id,r] of state.reservations) if(!r.cancelled) rows.push({t:"res", id, r, sort:r.dateStart});
  for (const [k,e] of state.exceptions) rows.push({t:"ex", id:k, e, sort:e.date});
  rows.sort((a,b)=> (a.sort<b.sort?-1:a.sort>b.sort?1:0));
  const body = rows.length ? `<div class="list">${rows.map(row=>{
    if (row.t==="res"){ const r=row.r;
      return `<button class="item" data-goto="${r.dateStart}">
        <span class="bar-c" style="background:var(--${r.kind==="blocked"?"k-blocked":"k-checkout"})"></span>
        <span class="m"><b>${esc(r.title)}${r.kind==="blocked"?" — blocked":""}</b>
        <span>${esc(shortDate(r.dateStart))}–${esc(shortDate(r.dateEnd))} · ${fmt12(toMin(r.timeStart))}–${fmt12(toMin(r.timeEnd))} · ${r.rooms.map(x=>x.split(" ")[0]).join(", ")}</span>
        ${r.person?`<span>${esc(r.person)}</span>`:""}</span></button>`;
    }
    const e=row.e, lbl = e.status==="cancelled"?"Cancelled":e.status==="moved"?"Changed":"Note";
    const name = baseTitle(e.baseId);
    return `<button class="item" data-goto="${e.date}">
      <span class="bar-c" style="background:var(--${e.status==="cancelled"?"line-2":"warn"})"></span>
      <span class="m"><b>${lbl} — ${esc(name)}</b>
      <span>${esc(shortDate(e.date))}${e.room?" · "+esc(e.room.split(" ")[0]):""}${e.start?" · "+fmt12(toMin(e.start))+"–"+fmt12(toMin(e.end)):""}</span>
      ${e.note?`<span>${esc(e.note)}</span>`:""}</span></button>`;
  }).join("")}</div>`
  : `<div class="empty">Nothing has been changed yet. The grid is showing the weekly master schedule exactly as it came from the spreadsheet.</div>`;
  openDrawer("Changes and checkouts", `${rows.length} entr${rows.length===1?"y":"ies"} on top of the master schedule`,
    body, `<button class="btn ghost" id="cClose">Close</button>`);
  document.getElementById("cClose").onclick = closeDrawer;
  drawer.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{
    state.date = el.dataset.goto; state.view="day"; syncView(); closeDrawer(); render();
  });
}
function baseTitle(baseId){
  if (String(baseId).startsWith("res:")){
    const r = state.reservations.get(String(baseId).slice(4));
    return r ? r.title : "Checkout";
  }
  const b = BASE.find(x=>x.id===baseId);
  return b ? `${b.title}${b.room?" · "+b.room.split(" ")[0]:""}` : baseId;
}
function flash(msg){
  const f = document.getElementById("dFoot");
  let n = f.querySelector(".flashmsg");
  if (!n){ n = document.createElement("span"); n.className="flashmsg";
    n.style.cssText="color:var(--accent);font-size:12px;font-weight:600;align-self:center"; f.appendChild(n); }
  n.textContent = msg;
}

/* ---------- persistence ---------- */
async function writeException(baseId, date, patch){
  if (!state.db) return;
  const id = exKey(baseId,date);
  if (patch.status === "clear") return clearException(baseId,date);
  const doc = {baseId, date, status:patch.status, note:patch.note||"", at:Date.now()};
  if (patch.status === "moved"){ doc.room=patch.room; doc.start=patch.start; doc.end=patch.end; }
  try { await state.db.doc("exceptions/"+id).set(doc); }
  catch(err){ alert("That change could not be saved. If you were signed in, your session may have expired — sign in again and retry."); }
}
async function clearException(baseId, date){
  if (!state.db) return;
  try { await state.db.doc("exceptions/"+exKey(baseId,date)).delete(); }
  catch(err){ alert("That change could not be saved. If you were signed in, your session may have expired — sign in again and retry."); }
}

/* ---------- export ---------- */
function buildCSV(){
  const days = state.view==="week"
    ? Array.from({length:7},(_,i)=>addDays(weekStart(state.date),i)) : [state.date];
  const rows = [["Date","Day","Room","Start","End","Type","Course","Title","Person","Status","Note"]];
  for (const d of days) for (const o of occurrencesOn(d))
    rows.push([d, DAYNAMES[dow(d)], o.room, toHM(o.start), toHM(o.end), KINDLABEL[o.kind],
      o.code, o.title, o.person, o.cancelled?"Cancelled":o.moved?"Changed":"Scheduled", o.note]);
  return rows.map(r=>r.map(c=>{ const s=String(c==null?"":c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(",")).join("\n");
}
function doExport(){
  const csv = buildCSV();
  const name = `room-schedule-${state.view==="week"?"week-of-"+weekStart(state.date):state.date}.csv`;
  const url = URL.createObjectURL(new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"}));
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- wiring ---------- */
function syncView(){
  const week = state.view==="week";
  document.getElementById("vDay").setAttribute("aria-pressed", String(!week));
  document.getElementById("vWeek").setAttribute("aria-pressed", String(week));
  document.getElementById("weekRoom").classList.toggle("hidden", !week);
  paintFold();
}
document.getElementById("prev").onclick = ()=>{ state.date = addDays(state.date, state.view==="week"?-7:-1); render(); };
document.getElementById("next").onclick = ()=>{ state.date = addDays(state.date, state.view==="week"?7:1); render(); };
document.getElementById("today").onclick = ()=>{ state.date = iso(new Date()); render(); };
document.getElementById("datepick").onchange = e=>{ if(e.target.value){ state.date = e.target.value; render(); } };
document.getElementById("vDay").onclick  = ()=>{ state.view="day"; syncView(); render(); };
document.getElementById("vWeek").onclick = ()=>{ state.view="week"; syncView(); render(); };
document.getElementById("search").oninput = e=>{ state.q = e.target.value.trim(); render(); };
function paintRoomsBtn(){
  const n = ROOMS.filter(isHidden).length;
  document.getElementById("roomsBtn").textContent = n ? `Rooms \u00b7 ${n} hidden` : "Rooms";
}
function paintFold(){
  const b = document.getElementById("foldBtn");
  b.textContent = state.collapsePractice ? `Show practice rooms (${PRACTICE.length})` : "Hide practice rooms";
  b.setAttribute("aria-pressed", String(!state.collapsePractice));
  b.classList.toggle("hidden", state.view === "week");
}
document.getElementById("foldBtn").onclick = ()=>{
  state.collapsePractice = !state.collapsePractice; paintFold(); render();
};
document.getElementById("findBtn").onclick = () => openFind();
document.getElementById("roomsBtn").onclick = openRooms;
document.getElementById("openChanges").onclick = openChanges;
document.getElementById("exportBtn").onclick = doExport;
document.getElementById("newBtn").onclick = ()=>openNew({date:state.date});

const wr = document.getElementById("weekRoom");
wr.innerHTML = ROOMS.map(r=>`<option>${esc(r)}</option>`).join("");
wr.onchange = e=>{ state.weekRoom = e.target.value; render(); };

loadHidden(); paintLegend(); paintFold(); paintRoomsBtn(); syncView(); render();

/* ---------- Supabase: storage, live sync, and the shared editor login ----------
   Documents are stored whole in a jsonb column, so the app's own shapes go in
   and come back untouched. Reads are open to anyone with the link; writes are
   gated by Postgres row-level security, not by anything in this page. */
const conn = document.getElementById("connBadge");
const role = document.getElementById("roleBadge");
const authBtn = document.getElementById("authBtn");
let sb = null;

function makeDb(client){
  const split = path => { const i = path.indexOf("/"); return [path.slice(0,i), path.slice(i+1)]; };
  const fail = e => { throw Object.assign(new Error(e.message||"write failed"), {code:e.code}); };
  return {
    doc(path){
      const [table,id] = split(path);
      return {
        id, path,
        async get(){ const {data} = await client.from(table).select("data").eq("id",id).maybeSingle();
          return {id, exists:!!data, data:()=>data&&data.data}; },
        async set(v){ const {error} = await client.from(table)
          .upsert({id, data:v, updated_at:new Date().toISOString()}); if(error) fail(error); },
        async delete(){ const {error} = await client.from(table).delete().eq("id",id); if(error) fail(error); }
      };
    },
    collection(table){
      return {
        path: table,
        doc: id => makeDb(client).doc(table+"/"+id),
        async add(v){ const {data,error} = await client.from(table)
          .insert({data:v}).select("id").single(); if(error) fail(error); return {id:data.id}; },
        onSnapshot(next, onErr){
          let dead = false;
          const pull = async () => {
            const {data,error} = await client.from(table).select("id,data");
            if (dead) return;
            if (error){ if(onErr) onErr({code:"unavailable", message:error.message}); return; }
            const docs = data.map(r=>({id:r.id, exists:true, data:()=>r.data}));
            next({docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:{}});
          };
          pull();
          const ch = client.channel("live-"+table)
            .on("postgres_changes", {event:"*", schema:"public", table}, pull)
            .subscribe(st=>{ conn.textContent = st==="SUBSCRIBED" ? "Live" : "Reconnecting"; });
          return ()=>{ dead=true; client.removeChannel(ch); };
        }
      };
    }
  };
}

function setSignedIn(on, email){
  state.canEdit = on;
  role.textContent = on ? "Can edit" : "View only";
  role.classList.toggle("edit", on);
  role.title = on ? "Signed in as "+email : "Sign in to check out rooms and mark changes.";
  authBtn.textContent = on ? "Sign out" : "Sign in to edit";
  document.getElementById("newBtn").classList.toggle("hidden", !on);
  render();
}

/* sign-in dialog */
const siBox = document.getElementById("signin"), siScrim = document.getElementById("authScrim");
const siErr = document.getElementById("siErr");
function openSignin(){
  siErr.hidden = true; document.getElementById("siPass").value = "";
  siBox.classList.add("on"); siScrim.classList.add("on"); siBox.setAttribute("aria-hidden","false");
  document.getElementById("siEmail").focus();
}
function closeSignin(){
  siBox.classList.remove("on"); siScrim.classList.remove("on"); siBox.setAttribute("aria-hidden","true");
}
document.getElementById("siCancel").onclick = closeSignin;
document.getElementById("siShow").onclick = ()=>{
  const f = document.getElementById("siPass"), b = document.getElementById("siShow");
  const shown = f.type === "text";
  f.type = shown ? "password" : "text";
  b.textContent = shown ? "Show" : "Hide";
  b.setAttribute("aria-pressed", String(!shown));
  f.focus();
};
siScrim.onclick = closeSignin;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSignin(); });

document.getElementById("siForm").onsubmit = async e=>{
  e.preventDefault();
  if (!sb) return;
  const go = document.getElementById("siGo");
  go.disabled = true; go.textContent = "Signing in…"; siErr.hidden = true;
  const {error} = await sb.auth.signInWithPassword({
    email: document.getElementById("siEmail").value.trim(),
    password: document.getElementById("siPass").value
  });
  go.disabled = false; go.textContent = "Sign in";
  if (error){
    siErr.innerHTML = "That email and password did not match.<br>" +
      "Tap <strong>Show</strong> to check the password for a stray space or a capital " +
      "from autocorrect. If it still fails, ask for the password to be reset.";
    siErr.hidden = false;
    document.getElementById("siPass").select();
    return;
  }
  closeSignin();
};

authBtn.onclick = async ()=>{
  if (!sb) return;
  if (state.canEdit){ await sb.auth.signOut(); } else { openSignin(); }
};

/* boot */
(async ()=>{
  const cfg = window.ROOM_CHECKOUT_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey ||
      cfg.supabaseUrl.includes("YOUR-PROJECT")){
    conn.textContent = "Not configured"; conn.classList.remove("live");
    role.textContent = "Master schedule only";
    role.title = "Add your Supabase URL and key to config.js to turn on checkouts.";
    authBtn.classList.add("hidden");
    return;
  }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  state.db = makeDb(sb);

  const {data:{session}} = await sb.auth.getSession();
  setSignedIn(!!session, session && session.user && session.user.email);
  sb.auth.onAuthStateChange((_e, sess)=> setSignedIn(!!sess, sess && sess.user && sess.user.email));

  state.db.collection("rooms").onSnapshot(snap=>{
    state.rooms = new Map(snap.docs.map(d=>[d.id, d.data()]));
    rebuildRooms(); render();
  });
  state.db.collection("exceptions").onSnapshot(snap=>{
    state.exceptions = new Map(snap.docs.map(d=>[d.id, d.data()])); render();
  });
  state.db.collection("reservations").onSnapshot(snap=>{
    state.reservations = new Map(snap.docs.map(d=>[d.id, d.data()])); render();
  });
})();
</script>
